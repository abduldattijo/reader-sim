name: analytics-check

on:
  workflow_dispatch:        # triggered by cron-job.org every day at 8am WAT (7am UTC)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # needed to commit history snapshots back to repo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run analytics check
        env:
          TDS_USERNAME: ${{ secrets.TDS_USERNAME }}
          TDS_PASSWORD: ${{ secrets.TDS_PASSWORD }}
        run: node analytics-check.js

      - name: Commit snapshot and data file
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add analytics-history/ analytics-data.json
          git diff --staged --quiet || git commit -m "analytics: $(date -u +%Y-%m-%d) snapshot"
          git push

      - name: Deploy dashboard to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          mkdir /tmp/netlify-deploy
          cp dashboard.html /tmp/netlify-deploy/index.html
          npx --yes netlify-cli deploy \
            --dir=/tmp/netlify-deploy \
            --prod \
            --site=$NETLIFY_SITE_ID \
            --auth=$NETLIFY_AUTH_TOKEN \
            --message="analytics: $(date -u +%Y-%m-%d)"
