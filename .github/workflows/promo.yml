name: promo-run

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: 'Article URL to promote'
        required: false
        default: ''
      traffic_source:
        description: 'Traffic source: direct, google, linkedin'
        required: false
        default: 'direct'
      bounce_pct:
        description: 'Bounce rate 0.0–1.0 (default 0.20)'
        required: false
        default: '0.20'
      mobile_pct:
        description: 'Mobile fraction 0.0–1.0 (default 0.33)'
        required: false
        default: '0.33'
      regions:
        description: 'Regions space-separated (default: fra ewr sgp ams tor)'
        required: false
        default: 'fra ewr sgp ams tor'
      rounds:
        description: 'Number of rounds (default 10)'
        required: false
        default: '10'
      readers_per_region:
        description: 'Readers per region per round (default 1, max 4)'
        required: false
        default: '1'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run promotion readers
        env:
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
          GUI_ARTICLE_URL:   ${{ github.event.inputs.article_url }}
          GUI_TRAFFIC_SOURCE: ${{ github.event.inputs.traffic_source }}
          GUI_BOUNCE_PCT:    ${{ github.event.inputs.bounce_pct }}
          GUI_MOBILE_PCT:    ${{ github.event.inputs.mobile_pct }}
          GUI_REGIONS:            ${{ github.event.inputs.regions }}
          GUI_ROUNDS:             ${{ github.event.inputs.rounds }}
          GUI_READERS_PER_REGION: ${{ github.event.inputs.readers_per_region }}
        run: |
          chmod +x run-promo.sh run-test.sh
          ./run-promo.sh
