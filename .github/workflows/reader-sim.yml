name: reader-sim

on:
  workflow_dispatch:  # triggered by cron-job.org every day at 20:00 Lagos time (19:00 UTC)

jobs:
  check-day:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.day_check.outputs.should_run }}
    steps:
      - id: day_check
        run: |
          DAY=$(date +%u)  # 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat 7=Sun
          if [[ "$DAY" == "1" || "$DAY" == "3" || "$DAY" == "5" ]]; then
            echo "should_run=true"  >> $GITHUB_OUTPUT
            echo "Today is Mon/Wed/Fri — running."
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Today is not a run day — skipping."
          fi

  run:
    needs: check-day
    if: needs.check-day.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install base dependencies
        run: npm install

      - name: Run scheduled readers
        env:
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
        run: |
          chmod +x run-scheduled.sh run-test.sh
          ./run-scheduled.sh

      - name: Run TDS analytics check
        env:
          TDS_USERNAME: ${{ secrets.TDS_USERNAME }}
          TDS_PASSWORD: ${{ secrets.TDS_PASSWORD }}
        run: |
          npx playwright install --with-deps chromium 2>/dev/null | tail -3
          node analytics-check.js

      - name: Upload debug screenshot (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-debug-screenshot
          path: analytics-debug.png
          if-no-files-found: ignore

      - name: Commit analytics snapshot and data file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analytics-history/ analytics-data.json
          git diff --cached --quiet || git commit -m "analytics: snapshot $(date -u +%Y-%m-%d)"
          git push

      - name: Deploy dashboard to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          mkdir /tmp/netlify-deploy
          cp dashboard.html /tmp/netlify-deploy/index.html
          npx --yes netlify-cli deploy \
            --dir=/tmp/netlify-deploy \
            --prod \
            --site=$NETLIFY_SITE_ID \
            --auth=$NETLIFY_AUTH_TOKEN \
            --message="analytics: $(date -u +%Y-%m-%d)"
