name: reader-sim

on:
  workflow_dispatch:  # triggered by cron-job.org every day at 20:00 Lagos time (19:00 UTC)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install base dependencies
        run: npm install

      - name: Run scheduled readers
        env:
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
        run: |
          chmod +x run-scheduled.sh run-test.sh
          ./run-scheduled.sh
