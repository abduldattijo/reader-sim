name: reader-sim

on:
  workflow_dispatch:  # triggered by cron-job.org every day at 20:00 Lagos time (19:00 UTC)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install base dependencies
        run: npm install

      - name: Run scheduled readers
        env:
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
        run: |
          chmod +x run-scheduled.sh run-test.sh
          ./run-scheduled.sh

      - name: Run TDS analytics check
        env:
          TDS_USERNAME: ${{ secrets.TDS_USERNAME }}
          TDS_PASSWORD: ${{ secrets.TDS_PASSWORD }}
        run: |
          npx playwright install --with-deps chromium 2>/dev/null | tail -3
          node analytics-check.js

      - name: Upload debug screenshot (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-debug-screenshot
          path: analytics-debug.png
          if-no-files-found: ignore

      - name: Commit analytics snapshot and data file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analytics-history/ analytics-data.json
          git diff --cached --quiet || git commit -m "analytics: snapshot $(date -u +%Y-%m-%d)"
          git push

      - name: Republish dashboard artifact
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx --yes @anthropic-ai/claude-code@latest --print \
            "Publish analytics-data.json (in the current directory) to the TDS analytics artifact at https://claude.ai/artifact/LyFB8MmtH5kpRwt9aSE1xL alongside the existing page (file_path: analytics-data.json, url: https://claude.ai/artifact/LyFB8MmtH5kpRwt9aSE1xL). Do only this one action."
